# Hosted, read-only Design Context Kit for razorpay.com.
#
# Everything this app serves was captured ahead of time and committed into the image. The running
# process cannot capture, crawl, log in, annotate or write anything: hosted mode refuses every
# POST. So there is no volume, no database and no secret needed to serve the library.

app = "razorpay-design-context"
primary_region = "sin"          # nearest live region to India; bom (Mumbai) is deprecated and refuses new machines

[build]
  dockerfile = "Dockerfile"

[env]
  DCK_HOSTED = "1"
  PORT = "8080"
  # Designs made through the chat panel are permanent and shared: the Razorpay team should see
  # each other's work. That means they cannot live on the container filesystem, which is wiped on
  # every deploy, so they go on the volume mounted below.
  DCK_DESIGNS_DIR = "/data/wireframes"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"   # idle demo costs nothing; suspend resumes in ~1s, unlike a cold start
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "4s"
    path = "/api/ping"

# A volume is attached to exactly one machine, so this app runs a single machine on purpose.
# Two machines would each get their own disk and the team would silently see two different
# libraries. Suspend still applies: an idle machine costs nothing and the volume survives it.
[mounts]
  source = "designs"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"                   # editing a 24MB snapshot peaks around 114MB of live heap, and
                                   # two people wireframing at once on 512MB was never tested
